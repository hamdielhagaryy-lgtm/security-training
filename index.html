<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محاكاة التصيد - تدريب</title>
<style>
body {
  font-family: Arial;
  background: #edf2f7;
  text-align: center;
  padding: 25px;
}
.card {
  background: white;
  max-width: 380px;
  margin: 35px auto;
  padding: 25px;
  border-radius: 14px;
}
button {
  padding: 12px 20px;
  border: 0;
  border-radius: 8px;
  background: #1877f2;
  color: white;
  font-size: 16px;
}
#lesson { display: none; }
</style>
</head>
<body>
<div class="card">
  <h2>🔵 محاكاة توعوية لفيسبوك</h2>
  <p>هل تستطيع اكتشاف علامات صفحة تسجيل الدخول المزيفة؟</p>
  <p>افحص عنوان الموقع قبل إدخال بياناتك.</p>
  <button onclick="document.getElementById('lesson').style.display='block'">
    اكتشف علامات التصيّد
  </button>
  <div id="lesson">
    <h3>⚠️ علامات الخطر</h3>
    <p>• عنوان موقع غريب أو به أخطاء.</p>
    <p>• رسالة مستعجلة تهدد بإغلاق حسابك.</p>
    <p>• طلب كلمة السر أو رمز التحقق عبر رابط مجهول.</p>
    <p>التدريب ده لا يطلب أو يحفظ أي بيانات شخصية.</p>
  </div>
</div>
</body>
</html>
